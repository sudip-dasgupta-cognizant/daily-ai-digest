name: Daily AI Digest

on:
  schedule:
    - cron: "0 2 * * *"   # 2:00 AM UTC = 7:30 AM IST
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: read
  models: read

jobs:
  send-digest:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_ROLE: ${{ secrets.DIGEST_ROLE }}
      DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate config.json
        run: |
          python -c "
          import json, os
          config = {
              'role': os.environ['DIGEST_ROLE'],
              'sender_email': os.environ['GMAIL_USER'],
              'recipient_email': os.environ['DIGEST_RECIPIENT']
          }
          with open('config.json', 'w') as f:
              json.dump(config, f)
          print('config.json created')
          "

      - name: Fetch news
        run: python src/fetch_news.py

      - name: Classify news
        run: python src/classify.py

      - name: Send email digest
        run: python src/send_email.py
